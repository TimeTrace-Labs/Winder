jepa:
  n_leads: 12
  n_samples: 1000
  n_tokens: 125
  lambda_sig: 0.1
  seed_pretrain: 0
  seed_probe: 0
  encoder_name: conv_trunk
  encoder: {}
  projector_name: mlp
  projector: {}
